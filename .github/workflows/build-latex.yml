name: Build LaTeX report

on:
  push:
    paths:
      - 'report.tex'
      - 'chapters/**'
      - 'images/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra texlive-lang-french

      - name: Build PDF (first pass)
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error report.tex || true

      - name: Build PDF (second pass)
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error report.tex || true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: report.pdf
